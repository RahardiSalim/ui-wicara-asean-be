[project]
name = "wicara-backend"
version = "0.1.0"
description = "FastAPI backend for WICARA curriculum-first slice."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.110",
  "httpx>=0.27",
  "manim>=0.19,<0.21",
  "PyJWT[crypto]>=2.8",
  "cryptography>=42.0",
  "pydantic-settings>=2.2",
  "redis>=5.0",
  "python-dotenv>=0.21,<2",
  "python-multipart>=0.0.9",
  "rapidfuzz>=3.9",
  "psycopg[binary]>=3.1",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27",
  "pytest>=8.0",
]
render = [
  "manim>=0.18",
  "manim-voiceover[gtts]>=0.3.7",
  "setuptools<81",
]
eduillustrate = [
  "chromadb>=0.6",
  "ffmpeg-python>=0.2",
  "google-cloud-aiplatform>=1.79",
  "google-generativeai>=0.8,<0.9",
  "langchain~=0.3.14",
  "langchain-community~=0.3.14",
  "langfuse>=2.58,<3",
  "litellm>=1.60",
  "moviepy>=2.1",
  "numpy>=2.0",
  "pillow",
  "pylatexenc>=2.10,<3",
  "pysrt",
  "SpeechRecognition>=3.14",
  "tqdm>=4.66",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "wicara_mvp_10_manim_templates*"]
