[project]
name = "wicara-backend"
version = "0.1.0"
description = "FastAPI backend for WICARA curriculum-first slice."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.110",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.8",
  "cryptography>=42.0",
  "pydantic-settings>=2.2",
  "redis>=5.0",
  "python-dotenv>=0.21,<2",
  "python-multipart>=0.0.9",
  "rapidfuzz>=3.9",
  "psycopg[binary]>=3.1",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]
# Only the media worker needs these. Manim drags in scipy, pycairo and
# manimpango, which need cairo/pango headers at build time and blow past a
# serverless bundle limit, and no API code imports it -- render_engine.py
# invokes it as `sys.executable -m manim` in a subprocess. Install with
# `pip install -e .[render]` wherever the worker runs.
render = [
  "manim>=0.19,<0.21",
  "manim-voiceover[gtts]>=0.3.7",
  "setuptools<81",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "wicara_mvp_10_manim_templates*"]
